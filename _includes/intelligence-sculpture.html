<div class="sculpture-wrap" data-intelligence-sculpture>
  <div class="sculpture-stage">
    <canvas
      class="sculpture-canvas"
      aria-label="Knowledge graph: an abstract interactive 3D point cloud. Drag horizontally or use arrow keys to rotate."
      role="img"
      tabindex="0"
    ></canvas>
  </div>
  <div class="sculpture-modes" role="group" aria-label="Visualization mode">
    <button type="button" aria-pressed="true" class="active" aria-label="Knowledge graph">Graph</button>
    <button type="button" aria-pressed="false" aria-label="Neural field">Neural</button>
    <button type="button" aria-pressed="false" aria-label="Latent space">Latent</button>
  </div>
</div>
